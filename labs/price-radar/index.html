<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CEGO Price Radar Test</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f7f4ee;color:#171717}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e7e1d8;border-radius:20px;padding:16px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap}input,button,select{padding:12px;border-radius:12px;border:1px solid #ddd;font-size:16px}input{flex:1;min-width:180px}button{background:#171717;color:#fff;font-weight:800}.primary{background:#e65a2f}.deal,.watch{padding:12px 0;border-top:1px dashed #ddd}.deal:first-child,.watch:first-child{border-top:0}.price{font-size:22px;font-weight:900}.muted{color:#777;font-size:13px}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#fff2d5;font-size:12px;margin:4px 5px 0 0}a{color:#e65a2f;font-weight:700;text-decoration:none}@media(max-width:600px){.row>*{width:100%}}</style></head><body><div class=wrap><h1>C•E•GO Price Radar</h1><div class=muted>Staging｜價格比較 + 補貨 watchlist + 零售商搜尋入口</div><div class=card><div class=row><input id=q value="牙膏"><button class=primary id=search>搵價錢</button></div><div id=links class=muted style="margin-top:10px"></div></div><div class=card><h2>價格 feed 測試</h2><div id=results></div></div><div class=card><h2>補貨提醒</h2><div class=row><input id=brand placeholder="慣用品牌"><input id=target type=number step=.1 placeholder="目標價"><select id=need><option value=7>7 日內</option><option value=14>14 日內</option><option value=30>30 日內</option></select><button id=add>加入</button></div><div id=watchlist></div></div></div><script>const db={牙膏:[['惠康','Colgate',29.9,36.9,'特價'],['百佳','Colgate',34,34,'第二件優惠待核實'],['萬寧','Darlie',31.5,35.9,'同品牌優惠']],洗頭水:[['屈臣氏','Pantene',48,55.9,'會員價'],['惠康','Pantene',52.9,52.9,'暫無優惠']],咖啡:[['百佳','UCC',69.9,79.9,'本週特價'],['惠康','UCC',72,78,'買二減十']]};let w=JSON.parse(localStorage.getItem('cego-staging-watch')||'[]');const retail={惠康:'https://www.wellcome.com.hk/zh-hant/search?text=',百佳:'https://www.parknshop.com/zh-hk/search?text=',萬寧:'https://www.mannings.com.hk/search?q=',屈臣氏:'https://www.watsons.com.hk/zh-hk/search?text='};function render(){const x=q.value.trim()||'牙膏',arr=(db[x]||[]).slice().sort((a,b)=>a[2]-b[2]);results.innerHTML=arr.length?arr.map((a,i)=>`<div class=deal><b>${a[0]}｜${a[1]}</b><div class=price>HK$${a[2].toFixed(1)}</div><span class=pill>${a[4]}</span>${i===0?'<span class=pill>目前較抵</span>':''}</div>`).join(''):'<div class=muted>未有 feed，可用上面零售商搜尋入口查。</div>';links.innerHTML=Object.entries(retail).map(([s,u])=>`<a target=_blank href="${u+encodeURIComponent(x)}">${s} 搜尋 ↗</a>`).join('　')}function rw(){watchlist.innerHTML=w.length?w.map((a,i)=>`<div class=watch><b>${a.name}${a.brand?'｜'+a.brand:''}</b><div class=muted>${a.target?'目標 HK$'+a.target+'｜':''}${a.need} 日內</div><button onclick="del(${i})">移除</button></div>`).join(''):'<div class=muted>未有補貨項目。</div>'}function del(i){w.splice(i,1);localStorage.setItem('cego-staging-watch',JSON.stringify(w));rw()}search.onclick=render;add.onclick=()=>{w.unshift({name:q.value.trim()||'牙膏',brand:brand.value.trim(),target:target.value||'',need:+need.value});localStorage.setItem('cego-staging-watch',JSON.stringify(w));rw()};window.del=del;render();rw()</script></body></html>
