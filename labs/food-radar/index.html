<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CEGO Food Radar V4</title><link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet"><style>:root{--green:#10a85a;--ink:#161616;--muted:#747474;--bg:#f7f5ef;--line:#ece7df;--orange:#e85c35}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}.app{max-width:900px;margin:auto;background:#fff;min-height:100vh}.top{padding:18px 16px 10px;background:linear-gradient(90deg,#efffd8,#fff 28%)}.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand h1{margin:0;font-size:30px;line-height:.95;color:#0d774f}.brand small{display:block;color:#111;font-size:14px;margin-top:6px}.loc{background:#eef6ff;border-radius:17px;padding:10px 12px;font-weight:800;font-size:14px}.search{margin:12px 0 8px;border:1px solid #ddd;border-radius:18px;padding:13px 14px;width:100%;font-size:16px}.filters{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.chip{border:1px solid #ddd;background:#fff;padding:10px 14px;border-radius:999px;white-space:nowrap;font-weight:700}.chip.active{background:var(--green);color:#fff;border-color:var(--green)}#map{height:300px}.mapwrap{position:relative}.mapbadge{position:absolute;z-index:3;top:14px;left:50%;transform:translateX(-50%);background:#fff;border-radius:16px;padding:10px 14px;font-weight:900;box-shadow:0 5px 18px #0002;text-align:center}.statusbar{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}.statusbar .muted{font-size:13px}.list{padding:0 14px 24px}.card{display:grid;grid-template-columns:1fr auto;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}.name{font-size:21px;font-weight:900}.badges{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.pill{background:#f4f2ed;border-radius:999px;padding:5px 8px;font-size:12px}.open{background:#dff7e9;color:#087b43;font-weight:900}.lic{background:#e9f7f0;color:#0b7850}.addr,.hours,.meta{color:var(--muted);font-size:14px;margin-top:6px}.hours{color:#078347;font-weight:800}.actions{display:flex;gap:8px;align-items:center}.go{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#e9f4ff;text-decoration:none;font-size:20px}.empty{padding:28px 8px;color:var(--muted);text-align:center}.err{color:#b42318}.ok{color:#12814d}.loading{opacity:.65}.foot{background:#eff9f2;padding:12px 16px;font-size:12px;color:#456;margin-top:10px}@media(max-width:640px){.brand h1{font-size:27px}.card{grid-template-columns:1fr}.actions{justify-content:flex-start}#map{height:265px}}</style></head><body><div class="app"><div class="top"><div class="brand"><div><h1>C•E•GO<br>Food Radar</h1><small>附近好食・即刻搵到</small></div><div class="loc" id="locBox">📍 未定位</div></div><input id="search" class="search" placeholder="搜尋食肆名稱／菜式，例如：茶餐廳、拉麵、咖啡"><div class="filters"><button class="chip active" id="openChip">營業中 ✓</button><button class="chip" data-type="restaurant">餐廳</button><button class="chip" data-type="cafe">咖啡</button><button class="chip" data-type="fast_food">快餐／小食</button><button class="chip" id="locateBtn">📍 重新定位</button></div></div><div class="mapwrap"><div class="mapbadge" id="mapBadge">等待定位</div><div id="map"></div></div><div class="statusbar"><b>距離最近</b><span class="muted" id="statusText">只顯示可確認目前營業中的店舖</span></div><div class="list" id="results"></div><div class="foot">FEHD 持牌資料：每日更新。營業時間：OpenStreetMap opening_hours；沒有可靠營業時間的店舖預設不列入「營業中」結果。</div></div><script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script><script src="https://openingh.openstreetmap.de/build/opening_hours+deps.min.js"></script><script>(()=>{const CSDI='https://portal.csdi.gov.hk/server/services/common/fehd_rcd_1630036390312_58893/MapServer/WFSServer';const OVERPASS='https://overpass-api.de/api/interpreter';const state={lat:22.3193,lng:114.1694,type:'',q:'',places:[],lic:[],markers:[]};const $=s=>document.querySelector(s),results=$('#results'),status=$('#statusText'),badge=$('#mapBadge'),locBox=$('#locBox');const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[state.lng,state.lat],zoom:15});let userMarker=new maplibregl.Marker({color:'#2787ff'}).setLngLat([state.lng,state.lat]).addTo(map);function dist(a,b,c,d){const R=6371000,t=x=>x*Math.PI/180,p1=t(a),p2=t(c),dp=t(c-a),dl=t(d-b),h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function coord(el){if(Number.isFinite(el.lat)&&Number.isFinite(el.lon))return[el.lat,el.lon];if(el.center)return[el.center.lat,el.center.lon];return null}function isOpen(tag){if(!tag)return false;try{return new opening_hours(tag).getState(new Date())===true}catch{return false}}function closingText(tag){if(!tag)return'';try{const oh=new opening_hours(tag),n=oh.getNextChange(new Date());if(n){return '營業中至 '+n.toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit',hour12:false})}}catch{}return '營業中'}function matchLicence(p){let best=null,bd=90;for(const l of state.lic){const d=dist(p.lat,p.lng,l.lat,l.lng);if(d<bd){bd=d;best=l}}return best}async function loadLicences(){const r=1100,dlat=r/111320,dlng=r/(111320*Math.cos(state.lat*Math.PI/180));const b=[state.lat-dlat,state.lng-dlng,state.lat+dlat,state.lng+dlng];const qs=new URLSearchParams({service:'WFS',version:'2.0.0',request:'GetFeature',typeNames:'fehd_rl',outputFormat:'GeoJSON',srsName:'EPSG:4326',bbox:b.join(','),count:'400'});try{const j=await fetch(CSDI+'?'+qs).then(x=>x.json());state.lic=(j.features||[]).map(f=>{const p=f.properties||{},c=f.geometry?.coordinates;if(!c)return null;return{name:p.SS||p.ss||'',address:p.ADR||p.adr||'',type:p.TYPE||p.type||'',lat:c[1],lng:c[0]}}).filter(Boolean)}catch{state.lic=[]}}async function loadPlaces(){status.textContent='正在查附近營業中的店舖…';results.innerHTML='<div class="empty loading">讀取營業時間中…</div>';const q=`[out:json][timeout:18];(nwr["amenity"~"restaurant|cafe|fast_food"](around:1200,${state.lat},${state.lng}););out center tags;`;try{const j=await fetch(OVERPASS,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q)}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()});state.places=(j.elements||[]).map(el=>{const c=coord(el),t=el.tags||{};if(!c||!t.name||!t.opening_hours)return null;return{name:t['name:zh-Hant']||t['name:zh']||t.name,type:t.amenity,cuisine:t.cuisine||'',hours:t.opening_hours,lat:c[0],lng:c[1],address:[t['addr:housenumber'],t['addr:street']].filter(Boolean).join(' '),phone:t.phone||t['contact:phone']||'',d:dist(state.lat,state.lng,c[0],c[1])}}).filter(Boolean).filter(x=>x.d<=1000&&isOpen(x.hours)).map(x=>({...x,licence:matchLicence(x)})).sort((a,b)=>a.d-b.d);render()}catch(e){status.textContent='營業時間服務暫時未能讀取：'+e.message;results.innerHTML='<div class="empty">GPS／FEHD 正常，但暫時未能取得 live 營業時間。稍後再試。</div>';badge.textContent='暫未取得營業時間'}}function render(){let a=state.places;if(state.type)a=a.filter(x=>x.type===state.type);if(state.q){const q=state.q.toLowerCase();a=a.filter(x=>(x.name+' '+x.cuisine+' '+(x.licence?.type||'')).toLowerCase().includes(q))}a=a.slice(0,20);badge.innerHTML=`1km 內找到 ${a.length} 間<br><span style="color:#1879d7;font-size:12px">只顯示營業中</span>`;status.textContent=`共 ${a.length} 間｜目前時間 ${new Date().toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit',hour12:false})}`;results.innerHTML=a.length?a.map((x,i)=>`<div class="card"><div><div class="name">${i+1}. ${esc(x.name)} <span class="pill open">營業中</span></div><div class="badges">${x.licence?'<span class="pill lic">官方持牌</span>':''}<span class="pill">${x.type==='cafe'?'咖啡店':x.type==='fast_food'?'快餐／小食':'餐廳'}</span><span class="pill">${Math.round(x.d)}m</span><span class="pill">🚶約 ${Math.max(1,Math.round(x.d/75))} 分鐘</span></div><div class="addr">${esc(x.licence?.address||x.address||'地址可由地圖查看')}</div><div class="hours">🕒 ${esc(closingText(x.hours))}</div><div class="meta">OSM：${esc(x.hours)}</div></div><div class="actions"><a class="go" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.name+' '+(x.licence?.address||''))}">➤</a>${x.phone?`<a class="go" href="tel:${esc(x.phone)}">☎</a>`:''}</div></div>`).join(''):'<div class="empty">1km 內暫時搵唔到「有可靠營業時間而且而家營業中」嘅店。可以試咖啡／餐廳篩選，或者稍後加入 Google Places enrichment。</div>';state.markers.forEach(m=>m.remove());state.markers=[];a.slice(0,20).forEach((x,i)=>{const e=document.createElement('div');e.style.cssText='width:30px;height:30px;border-radius:50%;background:#0aa95c;color:#fff;border:2px solid white;display:grid;place-items:center;font-weight:900;box-shadow:0 2px 6px #0003';e.textContent=i+1;state.markers.push(new maplibregl.Marker({element:e}).setLngLat([x.lng,x.lat]).addTo(map))})}async function setLoc(lat,lng,acc){state.lat=lat;state.lng=lng;locBox.textContent=`📍 已定位｜約 ${Math.round(acc||0)}m`;userMarker.setLngLat([lng,lat]);map.flyTo({center:[lng,lat],zoom:15});badge.textContent='搜尋中…';await loadLicences();await loadPlaces()}function locate(){if(!navigator.geolocation){status.textContent='瀏覽器不支援定位';return}status.textContent='正在定位…';navigator.geolocation.getCurrentPosition(p=>setLoc(p.coords.latitude,p.coords.longitude,p.coords.accuracy),e=>status.textContent='定位失敗：'+({1:'未允許定位',2:'無法取得位置',3:'定位逾時'}[e.code]||e.message),{enableHighAccuracy:true,timeout:15000,maximumAge:0})}$('#locateBtn').onclick=locate;$('#search').oninput=e=>{state.q=e.target.value.trim();render()};document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-type]').forEach(x=>x.classList.remove('active'));if(state.type===b.dataset.type){state.type=''}else{state.type=b.dataset.type;b.classList.add('active')}render()});map.on('load',locate)})();</script></body></html>
