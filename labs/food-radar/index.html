<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CEGO Food Radar V4.8</title><link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet"><style>:root{--green:#10a85a;--ink:#161616;--muted:#747474;--bg:#f7f5ef;--line:#ece7df}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}.app{max-width:900px;margin:auto;background:#fff;min-height:100vh}.top{padding:18px 16px 10px;background:linear-gradient(90deg,#efffd8,#fff 28%)}.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand h1{margin:0;font-size:30px;line-height:.95;color:#0d774f}.brand small{display:block;color:#111;font-size:14px;margin-top:6px}.loc{background:#eef6ff;border-radius:17px;padding:10px 12px;font-weight:800;font-size:14px}.edition-row,.filters,.category-filters,.radius-controls{display:flex;gap:8px;overflow:auto;align-items:center;padding-bottom:4px}.edition-row{margin-top:12px}.category-filters,.radius-controls{margin-top:8px}.edition,.chip{border:1px solid #ddd;background:#fff;border-radius:999px;padding:10px 14px;font-weight:800;white-space:nowrap}.edition{padding:8px 12px}.edition.current{background:#111;color:#fff;border-color:#111}.edition.future{color:#0d774f}.chip.active,.chip.open-global{background:var(--green);color:#fff;border-color:var(--green)}.search{margin:12px 0 8px;border:1px solid #ddd;border-radius:18px;padding:13px 14px;width:100%;font-size:16px}.radius-value{background:#161616;color:#fff;border-radius:999px;padding:10px 14px;font-weight:900;white-space:nowrap}#map{height:300px}.mapwrap{position:relative}.mapbadge{position:absolute;z-index:3;top:14px;left:50%;transform:translateX(-50%);background:#fff;border-radius:16px;padding:10px 14px;font-weight:900;box-shadow:0 5px 18px #0002;text-align:center}.statusbar{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}.statusbar .muted{font-size:13px}.list{padding:0 14px 24px}.card{display:grid;grid-template-columns:1fr auto;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}.name{font-size:21px;font-weight:900}.badges{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.pill{background:#f4f2ed;border-radius:999px;padding:5px 8px;font-size:12px}.open{background:#dff7e9;color:#087b43;font-weight:900}.pending{background:#fff1cf;color:#805800;font-weight:900}.lic{background:#e9f7f0;color:#0b7850}.late{background:#fff1cf;color:#8a5a00;font-weight:800}.addr,.hours,.meta{color:var(--muted);font-size:14px;margin-top:6px}.hours{color:#078347;font-weight:800}.hours.pending-text{color:#805800}.actions{display:flex;gap:8px;align-items:center}.go{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#e9f4ff;text-decoration:none;font-size:20px}.empty{padding:28px 8px;color:var(--muted);text-align:center}.loading{opacity:.65}.foot{background:#eff9f2;padding:12px 16px;font-size:12px;color:#456;margin-top:10px}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#111;color:#fff;padding:12px 16px;border-radius:14px;font-weight:800;z-index:99;display:none}.version{position:fixed;right:14px;bottom:18px;z-index:98;background:#222;color:#fff;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:900;box-shadow:0 3px 10px #0003}@media(max-width:640px){.brand h1{font-size:27px}.card{grid-template-columns:1fr}.actions{justify-content:flex-start}#map{height:265px}}</style></head><body><div class="app"><div class="top"><div class="brand"><div><h1>C•E•GO<br>Food Radar</h1><small>附近好食・即刻搵到</small></div><div class="loc" id="locBox">📍 未定位</div></div><div class="edition-row"><button class="edition current">🇭🇰 香港</button><button class="edition future" data-edition="tw">🇹🇼 台灣版</button><button class="edition future" data-edition="kr">🇰🇷 韓國版</button></div><input id="search" class="search" placeholder="搜尋食肆名稱／菜式，例如：茶餐廳、拉麵、咖啡"><div class="filters"><button class="chip open-global">營業中 ✓</button><button class="chip" id="locateBtn">📍 重新定位</button></div><div class="category-filters"><button class="chip active" data-type="">全部</button><button class="chip" data-type="restaurant">餐廳</button><button class="chip" data-type="cafe">咖啡</button><button class="chip" data-type="fast_food">快餐／小食</button><button class="chip" data-type="convenience">便利店</button></div><div class="radius-controls"><span class="radius-value" id="radiusValue">搜尋 50m</span><button class="chip" data-radius="-50">−50m</button><button class="chip" data-radius="25">+25m</button><button class="chip" data-radius="50">+50m</button></div></div><div class="mapwrap"><div class="mapbadge" id="mapBadge">等待定位</div><div id="map"></div></div><div class="statusbar"><b>距離最近</b><span class="muted" id="statusText">先找官方持牌食肆，再補營業時間</span></div><div class="list" id="results"></div><div class="foot">香港版以 FEHD 持牌食肆作主候選；一般餐廳未取得營業時間會先列出，再補資料。已確認休息的店舖不顯示；便利店及小食類需有較可靠的營業資料才優先加入。</div></div><div class="toast" id="toast"></div><div class="version">Food Radar v4.8</div><script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script><script src="https://openingh.openstreetmap.de/build/opening_hours+deps.min.js"></script><script>(()=>{const DATASET='fehd_rcd_1630036390312_58893',WFS=`https://portal.csdi.gov.hk/server/services/common/${DATASET}/MapServer/WFSServer`,ARC=`https://portal.csdi.gov.hk/server/rest/services/common/${DATASET}/FeatureServer/0/query`,OVERPASS='https://overpass-api.de/api/interpreter';const state={lat:22.3193,lng:114.1694,type:'',q:'',radius:50,places:[],lic:[],markers:[],ready:false,fehdSource:'',rawCount:0,fehdError:''};const $=s=>document.querySelector(s),results=$('#results'),status=$('#statusText'),badge=$('#mapBadge'),locBox=$('#locBox'),radiusValue=$('#radiusValue');const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[state.lng,state.lat],zoom:17});let userMarker=new maplibregl.Marker({color:'#2787ff'}).setLngLat([state.lng,state.lat]).addTo(map);function dist(a,b,c,d){const R=6371000,t=x=>x*Math.PI/180,p1=t(a),p2=t(c),dp=t(c-a),dl=t(d-b),h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function coord(el){if(Number.isFinite(el.lat)&&Number.isFinite(el.lon))return[el.lat,el.lon];if(el.center)return[el.center.lat,el.center.lon];return null}function openState(tag){if(!tag)return'unknown';try{return new opening_hours(tag).getState(new Date())?'open':'closed'}catch{return'unknown'}}function closingText(tag){if(!tag)return'';try{const oh=new opening_hours(tag),n=oh.getNextChange(new Date());if(n)return '營業中至 '+n.toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Hong_Kong'})}catch{}return'營業中'}function catName(t){return t==='cafe'?'咖啡店':t==='fast_food'?'快餐／小食':t==='convenience'?'便利店':'餐廳'}function fehdCat(t){const s=String(t||'').toUpperCase();return s==='RR'||s.includes('LIGHT')?'fast_food':'restaurant'}function norm(s){return String(s||'').toLowerCase().replace(/[\s\-–—·•.,，。()（）'"&]/g,'')}function nameScore(a,b){a=norm(a);b=norm(b);if(!a||!b)return 0;if(a===b)return 3;if(a.includes(b)||b.includes(a))return 2;return 0}function prop(p,names,re){for(const n of names)if(p[n]!=null&&String(p[n]).trim())return p[n];const k=Object.keys(p).find(x=>re.test(x));return k?p[k]:''}function normalPoint(c){if(!Array.isArray(c)||c.length<2)return null;const a=Number(c[0]),b=Number(c[1]);if(!Number.isFinite(a)||!Number.isFinite(b))return null;if(Math.abs(a)>90&&Math.abs(b)<=90)return{lat:b,lng:a};if(Math.abs(b)>90&&Math.abs(a)<=90)return{lat:a,lng:b};return null}function mapFeature(f){const p=f.properties||f.attributes||{};let g=null;if(f.geometry?.coordinates)g=normalPoint(f.geometry.coordinates);else if(Number.isFinite(f.geometry?.x)&&Number.isFinite(f.geometry?.y))g=normalPoint([f.geometry.x,f.geometry.y]);if(!g)return null;const name=prop(p,['SS','ss'],/(SHOP.*SIGN|SIGN.*NAME|^SS$)/i),address=prop(p,['ADR','adr'],/(ADDRESS|^ADR$)/i),type=prop(p,['TYPE','type'],/(LIC.*TYPE|^TYPE$)/i),licno=prop(p,['LICNO','licno'],/(LIC.*NO|LICEN.*NO)/i);const x={name:String(name||'').trim(),address:String(address||'').trim(),type:String(type||''),licno:String(licno||''),lat:g.lat,lng:g.lng};x.d=dist(state.lat,state.lng,x.lat,x.lng);return x}function bounds(extra=160){const r=state.radius+extra,dlat=r/111320,dlng=r/(111320*Math.cos(state.lat*Math.PI/180));return{lat0:state.lat-dlat,lng0:state.lng-dlng,lat1:state.lat+dlat,lng1:state.lng+dlng}}async function fetchArc(){const b=bounds(),geom=JSON.stringify({xmin:b.lng0,ymin:b.lat0,xmax:b.lng1,ymax:b.lat1,spatialReference:{wkid:4326}}),qs=new URLSearchParams({f:'geojson',returnGeometry:'true',spatialRel:'esriSpatialRelIntersects',geometry:geom,geometryType:'esriGeometryEnvelope',inSR:'4326',outSR:'4326',where:'1=1',outFields:'*'}),r=await fetch(ARC+'?'+qs);if(!r.ok)throw Error('ArcGIS '+r.status);const j=await r.json();if(j.error)throw Error(j.error.message||'ArcGIS error');return j.features||[]}async function fetchWfs(){const b=bounds(),qs=new URLSearchParams({service:'WFS',version:'2.0.0',request:'GetFeature',typeNames:'fehd_rl',outputFormat:'GeoJSON',srsName:'EPSG:4326',bbox:[b.lat0,b.lng0,b.lat1,b.lng1].join(','),count:'1000',resultType:'results',startIndex:'0'}),r=await fetch(WFS+'?'+qs);if(!r.ok)throw Error('WFS '+r.status);const j=await r.json();return j.features||[]}async function loadLicences(){state.lic=[];state.rawCount=0;state.fehdError='';let fs=[];try{fs=await fetchArc();state.fehdSource='ArcGIS'}catch(e1){try{fs=await fetchWfs();state.fehdSource='WFS'}catch(e2){state.fehdError=e1.message+' / '+e2.message;state.fehdSource='失敗'}}state.rawCount=fs.length;state.lic=fs.map(mapFeature).filter(x=>x&&x.name&&x.d<=state.radius).sort((a,b)=>a.d-b.d)}function renderImmediateFEHD(){state.places=state.lic.filter(l=>fehdCat(l.type)!=='fast_food').map(l=>({name:l.name,type:fehdCat(l.type),cuisine:'',hours:'',openStatus:'unknown',lat:l.lat,lng:l.lng,address:l.address,phone:'',d:l.d,licence:l,source:'fehd'}));render(true)}function matchOSM(l,osm,used){let best=-1,bestScore=-1;osm.forEach((o,i)=>{if(used.has(i)||o.type==='convenience')return;const d=dist(l.lat,l.lng,o.lat,o.lng);if(d>70)return;const ns=nameScore(l.name,o.name),score=ns*100-d;if((ns>0||d<=25)&&score>bestScore){best=i;bestScore=score}});return best}async function enrichPlaces(){status.textContent=`FEHD ${state.lic.length} 間（${state.fehdSource}），正在補營業時間…`;const q=`[out:json][timeout:18];(nwr["amenity"~"restaurant|cafe|fast_food"](around:${state.radius+100},${state.lat},${state.lng});nwr["shop"="convenience"](around:${state.radius+100},${state.lat},${state.lng}););out center tags;`;try{const j=await fetch(OVERPASS,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q)}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()});const osm=(j.elements||[]).map(el=>{const c=coord(el),t=el.tags||{};if(!c||!t.name)return null;const type=t.shop==='convenience'?'convenience':t.amenity;return{name:t['name:zh-Hant']||t['name:zh']||t.name,type,cuisine:t.cuisine||'',hours:t.opening_hours||'',lat:c[0],lng:c[1],address:[t['addr:housenumber'],t['addr:street']].filter(Boolean).join(' '),phone:t.phone||t['contact:phone']||'',d:dist(state.lat,state.lng,c[0],c[1])}}).filter(x=>x&&x.d<=state.radius);const used=new Set,merged=[];for(const l of state.lic){const i=matchOSM(l,osm,used),o=i>=0?osm[i]:null;if(i>=0)used.add(i);const st=o?openState(o.hours):'unknown',type=o?.type||fehdCat(l.type);if(st==='closed')continue;if(type==='fast_food'&&st!=='open')continue;merged.push({name:l.name,type,cuisine:o?.cuisine||'',hours:o?.hours||'',openStatus:st,lat:l.lat,lng:l.lng,address:l.address||o?.address||'',phone:o?.phone||'',d:l.d,licence:l,source:'fehd'})}osm.forEach((o,i)=>{if(used.has(i))return;const st=openState(o.hours);if(st!=='open')return;merged.push({...o,openStatus:'open',licence:null,source:'osm'})});state.places=merged.sort((a,b)=>a.d-b.d);render(false)}catch(e){render(false)}}function render(enriching=false){let a=state.places;if(state.type)a=a.filter(x=>x.type===state.type);if(state.q){const q=state.q.toLowerCase();a=a.filter(x=>(x.name+' '+x.cuisine+' '+catName(x.type)).toLowerCase().includes(q))}a=a.slice(0,30);radiusValue.textContent=`搜尋 ${state.radius}m`;const cat=state.type?catName(state.type):'全部類別',confirmed=a.filter(x=>x.openStatus==='open').length,pending=a.filter(x=>x.openStatus==='unknown').length;badge.innerHTML=`${state.radius}m 內找到 ${a.length} 間<br><span style="color:#1879d7;font-size:12px">${confirmed} 間確認營業・${pending} 間待補時間</span>`;if(!enriching){const now=new Date().toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Hong_Kong'});status.textContent=`共 ${a.length} 間｜${cat}｜${now}｜FEHD:${state.fehdSource} ${state.rawCount}→${state.lic.length}`+(state.fehdError?' ⚠️':'')}results.innerHTML=a.length?a.map((x,i)=>{const pending=x.openStatus!=='open';return `<div class="card"><div><div class="name">${i+1}. ${esc(x.name)} <span class="pill ${pending?'pending':'open'}">${pending?'暫按營業中':'營業中'}</span></div><div class="badges">${x.licence?'<span class="pill lic">FEHD 持牌</span>':''}<span class="pill">${catName(x.type)}</span><span class="pill">${Math.round(x.d)}m</span><span class="pill">🚶約 ${Math.max(1,Math.round(x.d/75))} 分鐘</span></div><div class="addr">${esc(x.address||'地址可由地圖查看')}</div><div class="hours ${pending?'pending-text':''}">${pending?'🕒 營業時間後台補查中':'🕒 '+esc(closingText(x.hours))}</div></div><div class="actions"><a class="go" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.name+' '+(x.address||''))}">➤</a>${x.phone?`<a class="go" href="tel:${esc(x.phone)}">☎</a>`:''}</div></div>`}).join(''):`<div class="empty">${state.radius}m 內仍未取得附近食肆。下方 FEHD 診斷數字可用來分辨係資料源、座標定距離篩選問題。</div>`;state.markers.forEach(m=>m.remove());state.markers=[];a.forEach((x,i)=>{const e=document.createElement('div');e.style.cssText=`width:30px;height:30px;border-radius:50%;background:${x.openStatus==='unknown'?'#e5a323':x.type==='convenience'?'#e5a323':'#0aa95c'};color:#fff;border:2px solid white;display:grid;place-items:center;font-weight:900;box-shadow:0 2px 6px #0003`;e.textContent=i+1;state.markers.push(new maplibregl.Marker({element:e}).setLngLat([x.lng,x.lat]).addTo(map))})}async function refreshNearby(){if(!state.ready)return;badge.textContent=`搜尋 ${state.radius}m 持牌食肆…`;status.textContent='讀取 FEHD 附近食肆…';results.innerHTML='<div class="empty loading">搜尋附近食肆中…</div>';await loadLicences();renderImmediateFEHD();enrichPlaces()}async function setLoc(lat,lng,acc){state.lat=lat;state.lng=lng;state.ready=true;locBox.textContent=`📍 已定位｜約 ${Math.round(acc||0)}m`;userMarker.setLngLat([lng,lat]);map.flyTo({center:[lng,lat],zoom:17});await refreshNearby()}function locate(){if(!navigator.geolocation){status.textContent='瀏覽器不支援定位';return}status.textContent='正在定位…';navigator.geolocation.getCurrentPosition(p=>setLoc(p.coords.latitude,p.coords.longitude,p.coords.accuracy),e=>status.textContent='定位失敗：'+({1:'未允許定位',2:'無法取得位置',3:'定位逾時'}[e.code]||e.message),{enableHighAccuracy:true,timeout:15000,maximumAge:0})}function showFuture(code){const toast=$('#toast');toast.textContent=code==='kr'?'🇰🇷 韓國版入口已預留':'🇹🇼 台灣版入口已預留';toast.style.display='block';clearTimeout(showFuture.t);showFuture.t=setTimeout(()=>toast.style.display='none',2200)}$('#locateBtn').onclick=locate;$('#search').oninput=e=>{state.q=e.target.value.trim();render(false)};document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-type]').forEach(x=>x.classList.remove('active'));state.type=b.dataset.type;b.classList.add('active');render(false)});document.querySelectorAll('[data-radius]').forEach(b=>b.onclick=async()=>{const next=Math.max(50,Math.min(1500,state.radius+(Number(b.dataset.radius)||0)));if(next===state.radius)return;state.radius=next;await refreshNearby()});document.querySelectorAll('[data-edition]').forEach(b=>b.onclick=()=>showFuture(b.dataset.edition));map.on('load',locate)})();</script></body></html>
