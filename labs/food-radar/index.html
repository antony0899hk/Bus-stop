<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CEGO Food Radar V3.1</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f7f4ee;color:#171717}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e7e1d8;border-radius:20px;padding:16px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap}button{padding:11px 14px;border:0;border-radius:999px;background:#171717;color:#fff;font-weight:700}.primary{background:#e65a2f}.primary:disabled{opacity:.55}.muted{color:#777;font-size:13px}.result{padding:12px 0;border-top:1px dashed #ddd}.result:first-child{border-top:0}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#f3f1ec;font-size:12px;margin:4px 5px 0 0}a{color:#e65a2f;font-weight:700;text-decoration:none}.ok{color:#168447}.err{color:#b42318}.live{background:#e8f7ef;color:#126a48}</style></head><body><div class="wrap"><h1>C•E•GO Food Radar</h1><div class="muted">V3.1 Staging｜真 GPS + CSDI 持牌食肆 bbox 搜尋</div><div class="card"><div class="row"><button class="primary" id="locateBtn" type="button">📍 用我位置</button><button id="demoBtn" type="button">大埔示範</button></div><p class="muted" id="statusText">未定位</p><p class="muted" id="dataText">等待定位後查官方資料。</p></div><div class="card"><h2>附近持牌食肆</h2><div id="resultsList"><div class="muted">請先按「用我位置」。</div></div></div><div class="card"><b>資料說明</b><p class="muted">店名優先使用 FEHD 官方 Shop Sign（SS）欄位；如該牌照沒有登記店名，才顯示「未提供店名」。</p></div></div><script>(()=>{const WFS='https://portal.csdi.gov.hk/server/services/common/fehd_rcd_1630036390312_58893/MapServer/WFSServer';const TYPE='fehd_rl';let current={lat:22.4502,lng:114.1685};const locateBtn=document.getElementById('locateBtn'),demoBtn=document.getElementById('demoBtn'),statusText=document.getElementById('statusText'),dataText=document.getElementById('dataText'),resultsList=document.getElementById('resultsList');function distance(a,b,c,e){const R=6371000,t=x=>x*Math.PI/180,p1=t(a),p2=t(c),dp=t(c-a),dl=t(e-b),h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h))}function bbox(lat,lng,r=1000){const dLat=r/111320,dLng=r/(111320*Math.cos(lat*Math.PI/180));return[lat-dLat,lng-dLng,lat+dLat,lng+dLng]}function first(p,keys){for(const k of keys){if(p[k]!==undefined&&p[k]!==null&&String(p[k]).trim())return String(p[k]).trim()}return''}function esc(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function normalise(f){const p=f.properties||{},g=f.geometry||{};let lng,lat;if(g.type==='Point'&&g.coordinates){[lng,lat]=g.coordinates}else if(g.type==='MultiPoint'&&g.coordinates?.[0]){[lng,lat]=g.coordinates[0]}if(!Number.isFinite(lat)||!Number.isFinite(lng))return null;const name=first(p,['SS','ss','SHOP_SIGN_TC','SHOP_SIGN','SHOP_SIGN_EN','shop_sign_tc','shop_sign','NAME_TC','NAME','name','TRADENAME_TC','TRADENAME']);const type=first(p,['TYPE','type','LICENCE_TYPE_TC','LICENCE_TYPE','licence_type_tc','LIC_TYPE_TC','LIC_TYPE','TYPE_TC'])||'持牌食肆';const address=first(p,['ADR','adr','ADDRESS_TC','ADDRESS','address_tc','address','PREMISES_ADDRESS_TC','PREMISES_ADDRESS']);const licno=first(p,['LICNO','licno','LICENCE_NO','LICENSE_NO']);return{name:name||'未提供店名',type,address,licno,lat,lng,dist:distance(current.lat,current.lng,lat,lng)}}async function loadNearby(){dataText.textContent='CSDI：查詢附近持牌食肆中…';resultsList.innerHTML='<div class="muted">讀取官方資料中…</div>';const b=bbox(current.lat,current.lng,1100);const qs=new URLSearchParams({service:'WFS',version:'2.0.0',request:'GetFeature',typeNames:TYPE,outputFormat:'GeoJSON',srsName:'EPSG:4326',bbox:b.join(','),count:'300',resultType:'results',startIndex:'0'});try{const r=await fetch(WFS+'?'+qs.toString(),{headers:{Accept:'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();const arr=(j.features||[]).map(normalise).filter(Boolean).filter(x=>x.dist<=1000).sort((a,b)=>a.dist-b.dist);dataText.textContent=`✅ 官方 CSDI：bbox 命中 ${(j.features||[]).length} 筆，1km 內 ${arr.length} 間。`;resultsList.innerHTML=arr.length?arr.slice(0,20).map((x,i)=>`<div class="result"><b>#${i+1} ${esc(x.name)}</b><div><span class="pill live">官方持牌</span><span class="pill">${esc(x.type)}</span><span class="pill">${Math.round(x.dist)}m</span><span class="pill">🚶約 ${Math.max(1,Math.round(x.dist/75))} 分鐘</span></div>${x.address?`<p class="muted">${esc(x.address)}</p>`:''}${x.licno?`<div class="muted">牌照：${esc(x.licno)}</div>`:''}<p><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((x.name!=='未提供店名'?x.name+' ':'')+x.address)}">Google Maps ↗</a></p></div>`).join(''):'<div class="muted">1km 內暫時未有官方結果。</div>'}catch(e){dataText.textContent='⚠️ CSDI 暫時查詢失敗：'+e.message;resultsList.innerHTML='<div class="muted">GPS 正常，但官方空間資料暫時未能讀取。</div>'}}function setStatus(text,kind=''){statusText.textContent=text;statusText.className='muted '+kind}function setLocation(lat,lng,label){current={lat,lng};setStatus(label,'ok');loadNearby()}locateBtn.addEventListener('click',()=>{if(!navigator.geolocation){setStatus('此瀏覽器不支援定位。','err');return}locateBtn.disabled=true;setStatus('正在取得你目前位置…');navigator.geolocation.getCurrentPosition(pos=>{locateBtn.disabled=false;const{latitude,longitude,accuracy}=pos.coords;setLocation(latitude,longitude,`已定位｜精確度約 ${Math.round(accuracy||0)}m`)},err=>{locateBtn.disabled=false;setStatus(({1:'定位權限被拒絕。',2:'暫時取得唔到 GPS。',3:'定位逾時。'}[err.code]||'定位失敗。'),'err')},{enableHighAccuracy:true,timeout:15000,maximumAge:0})});demoBtn.addEventListener('click',()=>setLocation(22.4502,114.1685,'大埔示範位置'))})();</script></body></html>
