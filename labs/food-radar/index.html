<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CEGO Food Radar V5.0</title>
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{--green:#10a85a;--ink:#161616;--muted:#747474;--bg:#f7f5ef;--line:#ece7df}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
.app{max-width:900px;margin:auto;background:#fff;min-height:100vh}.top{padding:18px 16px 10px;background:linear-gradient(90deg,#efffd8,#fff 28%)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand h1{margin:0;font-size:30px;line-height:.95;color:#0d774f}.brand small{display:block;font-size:14px;margin-top:6px}.loc{background:#eef6ff;border-radius:17px;padding:10px 12px;font-weight:800;font-size:14px}
.edition-row,.filters,.category-filters,.radius-controls{display:flex;gap:8px;overflow:auto;align-items:center;padding-bottom:4px}.edition-row{margin-top:12px}.category-filters,.radius-controls{margin-top:8px}
.edition,.chip{border:1px solid #ddd;background:#fff;border-radius:999px;padding:10px 14px;font-weight:800;white-space:nowrap}.edition{padding:8px 12px}.edition.current{background:#111;color:#fff;border-color:#111}.edition.future{color:#0d774f}.chip.active,.chip.raw{background:var(--green);color:#fff;border-color:var(--green)}
.search{margin:12px 0 8px;border:1px solid #ddd;border-radius:18px;padding:13px 14px;width:100%;font-size:16px}.radius-value{background:#161616;color:#fff;border-radius:999px;padding:10px 14px;font-weight:900;white-space:nowrap}
#map{height:300px}.mapwrap{position:relative}.mapbadge{position:absolute;z-index:3;top:14px;left:50%;transform:translateX(-50%);background:#fff;border-radius:16px;padding:10px 14px;font-weight:900;box-shadow:0 5px 18px #0002;text-align:center;min-width:220px}
.statusbar{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}.statusbar .muted{font-size:12px;text-align:right}.list{padding:0 14px 24px}.card{display:grid;grid-template-columns:1fr auto;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}.name{font-size:20px;font-weight:900}.badges{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.pill{background:#f4f2ed;border-radius:999px;padding:5px 8px;font-size:12px}.fehd{background:#e9f7f0;color:#0b7850;font-weight:900}.osm{background:#eaf2ff;color:#1767aa;font-weight:900}.unknown{background:#fff1cf;color:#805800;font-weight:900}.outside{background:#f3e9ff;color:#7142a8;font-weight:900}.addr,.meta{color:var(--muted);font-size:13px;margin-top:6px}.rawline{font-size:12px;color:#555;margin-top:5px;word-break:break-word}.actions{display:flex;gap:8px;align-items:center}.go{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#e9f4ff;text-decoration:none;font-size:20px}.empty{padding:28px 8px;color:var(--muted);text-align:center}.loading{opacity:.65}.foot{background:#eff9f2;padding:12px 16px;font-size:12px;color:#456;margin-top:10px}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#111;color:#fff;padding:12px 16px;border-radius:14px;font-weight:800;z-index:99;display:none}.version{position:fixed;right:14px;bottom:18px;z-index:98;background:#222;color:#fff;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:900;box-shadow:0 3px 10px #0003}
@media(max-width:640px){.brand h1{font-size:27px}.card{grid-template-columns:1fr}.actions{justify-content:flex-start}#map{height:265px}}
</style>
</head>
<body>
<div class="app">
<div class="top">
<div class="brand"><div><h1>C•E•GO<br>Food Radar</h1><small>附近好食・即刻搵到</small></div><div class="loc" id="locBox">📍 未定位</div></div>
<div class="edition-row"><button class="edition current">🇭🇰 香港</button><button class="edition future" data-edition="tw">🇹🇼 台灣版</button><button class="edition future" data-edition="kr">🇰🇷 韓國版</button></div>
<input id="search" class="search" placeholder="搜尋店名／地址／類別">
<div class="filters"><button class="chip raw">全部資料直出 ✓</button><button class="chip" id="locateBtn">📍 重新定位</button></div>
<div class="category-filters"><button class="chip active" data-type="">全部</button><button class="chip" data-type="restaurant">餐廳</button><button class="chip" data-type="cafe">咖啡</button><button class="chip" data-type="fast_food">快餐／小食</button><button class="chip" data-type="convenience">便利店</button></div>
<div class="radius-controls"><span class="radius-value" id="radiusValue">搜尋 50m</span><button class="chip" data-radius="-50">−50m</button><button class="chip" data-radius="25">+25m</button><button class="chip" data-radius="50">+50m</button></div>
</div>
<div class="mapwrap"><div class="mapbadge" id="mapBadge">等待定位</div><div id="map"></div></div>
<div class="statusbar"><b>原始附近資料</b><span class="muted" id="statusText">暫停自動篩選</span></div>
<div class="list" id="results"></div>
<div class="foot">V5.0 診斷模式：FEHD / OSM 回傳的店舖先全部列出，不因營業時間、店種、距離或重複資料自動刪除。先確認資料源實際有甚麼，再逐項加回篩選規則。</div>
</div>
<div class="toast" id="toast"></div><div class="version">Food Radar v5.0 RAW</div>
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="https://openingh.openstreetmap.de/build/opening_hours+deps.min.js"></script>
<script>
(()=>{
const DATASET='fehd_rcd_1630036390312_58893';
const ARC=`https://portal.csdi.gov.hk/server/rest/services/common/${DATASET}/FeatureServer/0/query`;
const WFS=`https://portal.csdi.gov.hk/server/services/common/${DATASET}/MapServer/WFSServer`;
const OVERPASS='https://overpass-api.de/api/interpreter';
const state={lat:22.3193,lng:114.1694,radius:50,type:'',q:'',places:[],markers:[],ready:false,fehdRaw:0,fehdMapped:0,osmRaw:0,source:'',error:''};
const $=s=>document.querySelector(s),results=$('#results'),status=$('#statusText'),badge=$('#mapBadge'),locBox=$('#locBox'),radiusValue=$('#radiusValue');
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[state.lng,state.lat],zoom:17});
let userMarker=new maplibregl.Marker({color:'#2787ff'}).setLngLat([state.lng,state.lat]).addTo(map);
function dist(a,b,c,d){const R=6371000,t=x=>x*Math.PI/180,p1=t(a),p2=t(c),dp=t(c-a),dl=t(d-b),h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function coord(el){if(Number.isFinite(el.lat)&&Number.isFinite(el.lon))return[el.lat,el.lon];if(el.center)return[el.center.lat,el.center.lon];return null}
function openState(tag){if(!tag)return'未有時間';try{return new opening_hours(tag).getState(new Date())?'營業中':'目前休息'}catch{return'時間格式未識別'}}
function catName(t){return t==='cafe'?'咖啡店':t==='fast_food'?'快餐／小食':t==='convenience'?'便利店':'餐廳'}
function fehdCat(t){const s=String(t||'').toUpperCase();return s.includes('LIGHT')||s.includes('小食')||s==='LR'?'fast_food':'restaurant'}
function normalPoint(c){if(!Array.isArray(c)||c.length<2)return null;const a=Number(c[0]),b=Number(c[1]);if(!Number.isFinite(a)||!Number.isFinite(b))return null;if(Math.abs(a)>90&&Math.abs(b)<=90)return{lat:b,lng:a};if(Math.abs(b)>90&&Math.abs(a)<=90)return{lat:a,lng:b};return null}
function pick(p,keys,re){for(const k of keys)if(p[k]!=null&&String(p[k]).trim())return String(p[k]).trim();const k=Object.keys(p).find(x=>re.test(x)&&p[x]!=null&&String(p[x]).trim());return k?String(p[k]).trim():''}
function guessAddress(p){const vals=Object.values(p).map(v=>String(v??'').trim()).filter(Boolean);return vals.find(v=>v.length>8&&/(香港|九龍|新界|街|道|商場|中心|舖|樓)/.test(v))||''}
function guessName(p,address){const vals=Object.values(p).map(v=>String(v??'').trim()).filter(Boolean);return vals.find(v=>v!==address&&v.length>=2&&v.length<=80&&!/^\d+$/.test(v))||'[FEHD 未識別店名]'}
function rawSummary(p){return Object.entries(p).slice(0,8).map(([k,v])=>`${k}=${String(v??'').slice(0,45)}`).join(' ｜ ')}
function mapFEHD(f,i){const p=f.properties||f.attributes||{};const g=f.geometry?.coordinates?normalPoint(f.geometry.coordinates):Number.isFinite(f.geometry?.x)&&Number.isFinite(f.geometry?.y)?normalPoint([f.geometry.x,f.geometry.y]):null;let address=pick(p,['ADR','adr','ADDRESS','Address'],/(ADDRESS|^ADR$)/i)||guessAddress(p);let name=pick(p,['SS','ss','SHOP_SIGN','SHOPNAME','NAME'],/(SHOP.*SIGN|SHOP.*NAME|SIGN.*NAME|^SS$|^NAME$)/i)||guessName(p,address);const type=pick(p,['TYPE','type','LIC_TYPE'],/(LIC.*TYPE|^TYPE$)/i);const licno=pick(p,['LICNO','licno'],/(LIC.*NO|LICEN.*NO)/i);return{name,address,type:fehdCat(type),rawType:type,licno,lat:g?.lat??null,lng:g?.lng??null,d:g?dist(state.lat,state.lng,g.lat,g.lng):null,source:'fehd',hours:'',openStatus:'未有時間',raw:rawSummary(p),rawIndex:i+1}}
function bounds(extra=150){const r=state.radius+extra,dlat=r/111320,dlng=r/(111320*Math.cos(state.lat*Math.PI/180));return{lat0:state.lat-dlat,lng0:state.lng-dlng,lat1:state.lat+dlat,lng1:state.lng+dlng}}
async function fetchArc(){const b=bounds(),geometry=JSON.stringify({xmin:b.lng0,ymin:b.lat0,xmax:b.lng1,ymax:b.lat1,spatialReference:{wkid:4326}}),qs=new URLSearchParams({f:'geojson',returnGeometry:'true',spatialRel:'esriSpatialRelIntersects',geometry,geometryType:'esriGeometryEnvelope',inSR:'4326',outSR:'4326',where:'1=1',outFields:'*'}),r=await fetch(ARC+'?'+qs);if(!r.ok)throw Error('ArcGIS '+r.status);const j=await r.json();if(j.error)throw Error(j.error.message||'ArcGIS error');return j.features||[]}
async function fetchWfs(){const b=bounds(),qs=new URLSearchParams({service:'WFS',version:'2.0.0',request:'GetFeature',typeNames:'fehd_rl',outputFormat:'GeoJSON',srsName:'EPSG:4326',bbox:[b.lat0,b.lng0,b.lat1,b.lng1].join(','),count:'1000'}),r=await fetch(WFS+'?'+qs);if(!r.ok)throw Error('WFS '+r.status);return(await r.json()).features||[]}
async function loadFEHD(){let fs=[];state.error='';try{fs=await fetchArc();state.source='ArcGIS'}catch(e1){try{fs=await fetchWfs();state.source='WFS'}catch(e2){state.source='失敗';state.error=e1.message+' / '+e2.message}}state.fehdRaw=fs.length;const out=fs.map(mapFEHD);state.fehdMapped=out.filter(x=>Number.isFinite(x.lat)&&Number.isFinite(x.lng)).length;return out}
async function loadOSM(){const r=state.radius+150,q=`[out:json][timeout:18];(nwr["amenity"~"restaurant|cafe|fast_food"](around:${r},${state.lat},${state.lng});nwr["shop"="convenience"](around:${r},${state.lat},${state.lng}););out center tags;`;try{const j=await fetch(OVERPASS,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q)}).then(x=>{if(!x.ok)throw Error('HTTP '+x.status);return x.json()});state.osmRaw=(j.elements||[]).length;return(j.elements||[]).map((el,i)=>{const c=coord(el),t=el.tags||{},type=t.shop==='convenience'?'convenience':t.amenity||'restaurant',hours=t.opening_hours||'';return{name:t['name:zh-Hant']||t['name:zh']||t.name||'[OSM 未有店名]',type,hours,openStatus:openState(hours),lat:c?.[0]??null,lng:c?.[1]??null,address:[t['addr:housenumber'],t['addr:street']].filter(Boolean).join(' '),phone:t.phone||t['contact:phone']||'',d:c?dist(state.lat,state.lng,c[0],c[1]):null,source:'osm',raw:`OSM ${el.type||''} ${el.id||''} ｜ amenity=${t.amenity||''} ｜ shop=${t.shop||''} ｜ opening_hours=${hours||'—'}`,rawIndex:i+1}})}catch(e){state.osmRaw=0;state.error+=(state.error?' / ':'')+'OSM '+e.message;return[]}}
async function refreshNearby(){if(!state.ready)return;badge.textContent='讀取全部原始資料…';status.textContent='不做營業／距離／重複篩選';results.innerHTML='<div class="empty loading">FEHD + OSM 全部直出中…</div>';const [fehd,osm]=await Promise.all([loadFEHD(),loadOSM()]);state.places=[...fehd,...osm].sort((a,b)=>(Number.isFinite(a.d)?a.d:999999)-(Number.isFinite(b.d)?b.d:999999));render()}
function render(){let a=state.places;if(state.type)a=a.filter(x=>x.type===state.type);if(state.q){const q=state.q.toLowerCase();a=a.filter(x=>(x.name+' '+x.address+' '+catName(x.type)+' '+x.raw).toLowerCase().includes(q))}radiusValue.textContent=`搜尋 ${state.radius}m`;badge.innerHTML=`資料源共回傳 ${a.length} 筆<br><span style="color:#1879d7;font-size:12px">FEHD ${state.fehdRaw} ・ OSM ${state.osmRaw} ・ 未自動刪除</span>`;const now=new Date().toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Hong_Kong'});status.textContent=`${now}｜FEHD:${state.source} ${state.fehdRaw}/${state.fehdMapped}｜OSM:${state.osmRaw}`+(state.error?' ⚠️':'');results.innerHTML=a.length?a.map((x,i)=>{const hasD=Number.isFinite(x.d),outside=hasD&&x.d>state.radius;return`<div class="card"><div><div class="name">${i+1}. ${esc(x.name)}</div><div class="badges"><span class="pill ${x.source==='fehd'?'fehd':'osm'}">${x.source==='fehd'?'FEHD':'OSM'}</span><span class="pill">${catName(x.type)}</span><span class="pill ${outside?'outside':''}">${hasD?Math.round(x.d)+'m':'座標未識別'}</span>${outside?`<span class="pill outside">超出設定 ${state.radius}m</span>`:''}<span class="pill unknown">${esc(x.openStatus)}</span></div><div class="addr">${esc(x.address||'未有地址')}</div>${x.licno?`<div class="meta">牌照：${esc(x.licno)}${x.rawType?' ｜ '+esc(x.rawType):''}</div>`:''}<div class="rawline">${esc(x.raw)}</div></div><div class="actions">${Number.isFinite(x.lat)&&Number.isFinite(x.lng)?`<a class="go" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${x.lat},${x.lng}">➤</a>`:''}${x.phone?`<a class="go" href="tel:${esc(x.phone)}">☎</a>`:''}</div></div>`}).join(''):'<div class="empty">資料源今次真的回傳 0 筆。</div>';state.markers.forEach(m=>m.remove());state.markers=[];a.forEach((x,i)=>{if(!Number.isFinite(x.lat)||!Number.isFinite(x.lng))return;const e=document.createElement('div');e.style.cssText=`width:30px;height:30px;border-radius:50%;background:${x.source==='fehd'?'#0aa95c':'#267fd1'};color:#fff;border:2px solid white;display:grid;place-items:center;font-weight:900;box-shadow:0 2px 6px #0003`;e.textContent=i+1;state.markers.push(new maplibregl.Marker({element:e}).setLngLat([x.lng,x.lat]).addTo(map))})}
async function setLoc(lat,lng,acc){state.lat=lat;state.lng=lng;state.ready=true;locBox.textContent=`📍 已定位｜約 ${Math.round(acc||0)}m`;userMarker.setLngLat([lng,lat]);map.flyTo({center:[lng,lat],zoom:17});await refreshNearby()}
function locate(){if(!navigator.geolocation){status.textContent='瀏覽器不支援定位';return}status.textContent='正在定位…';navigator.geolocation.getCurrentPosition(p=>setLoc(p.coords.latitude,p.coords.longitude,p.coords.accuracy),e=>status.textContent='定位失敗：'+({1:'未允許定位',2:'無法取得位置',3:'定位逾時'}[e.code]||e.message),{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
function showFuture(code){const t=$('#toast');t.textContent=code==='kr'?'🇰🇷 韓國版入口已預留':'🇹🇼 台灣版入口已預留';t.style.display='block';clearTimeout(showFuture.t);showFuture.t=setTimeout(()=>t.style.display='none',2200)}
$('#locateBtn').onclick=locate;$('#search').oninput=e=>{state.q=e.target.value.trim();render()};document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-type]').forEach(x=>x.classList.remove('active'));state.type=b.dataset.type;b.classList.add('active');render()});document.querySelectorAll('[data-radius]').forEach(b=>b.onclick=async()=>{const n=Math.max(50,Math.min(1500,state.radius+(Number(b.dataset.radius)||0)));if(n===state.radius)return;state.radius=n;await refreshNearby()});document.querySelectorAll('[data-edition]').forEach(b=>b.onclick=()=>showFuture(b.dataset.edition));map.on('load',locate);
})();
</script>
</body></html>
