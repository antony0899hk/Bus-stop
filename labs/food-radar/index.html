<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CEGO Food Radar Test</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f7f4ee;color:#171717}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e7e1d8;border-radius:20px;padding:16px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap}button{padding:11px 14px;border:0;border-radius:999px;background:#171717;color:#fff;font-weight:700}.primary{background:#e65a2f}.muted{color:#777;font-size:13px}.result{padding:12px 0;border-top:1px dashed #ddd}.result:first-child{border-top:0}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#f3f1ec;font-size:12px;margin:4px 5px 0 0}a{color:#e65a2f;font-weight:700;text-decoration:none}</style></head><body><div class="wrap"><h1>C•E•GO Food Radar</h1><div class="muted">Staging｜GPS Nearby Core + FEHD 官方資料來源驗證</div><div class="card"><div class="row"><button class="primary" id="locate">📍 用我位置</button><button id="demo">大埔示範</button></div><p class="muted" id="status">未定位</p></div><div class="card"><h2>附近結果測試</h2><div id="results"></div></div><div class="card"><b>官方資料管</b><p class="muted">FEHD 食肆牌照及其他食物牌照已接入 source pipeline；正式 nearby 座標層下一步接 CSDI。現階段先測 GPS、距離排序、Google Maps 導航與手機 UX。</p></div></div><script>const demo=[['大埔墟熟食中心',22.4477,114.1679,'熟食中心'],['大埔中心一帶餐廳',22.4511,114.1687,'餐廳'],['廣福道小食',22.4471,114.1662,'小食'],['大埔咖啡店',22.4495,114.1698,'咖啡']];function d(a,b,c,e){const R=6371000,t=x=>x*Math.PI/180,p1=t(a),p2=t(c),dp=t(c-a),dl=t(e-b),h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h))}function render(lat,lng){const arr=demo.map(x=>({...{name:x[0],lat:x[1],lng:x[2],type:x[3]},dist:d(lat,lng,x[1],x[2])})).sort((a,b)=>a.dist-b.dist);results.innerHTML=arr.map((x,i)=>`<div class=result><b>#${i+1} ${x.name}</b><div><span class=pill>${x.type}</span><span class=pill>${Math.round(x.dist)}m</span><span class=pill>🚶約 ${Math.max(1,Math.round(x.dist/75))} 分鐘</span></div><p><a target=_blank href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.name)}">Google Maps 導航 ↗</a></p></div>`).join('')}locate.onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{status.textContent='已用你目前位置';render(p.coords.latitude,p.coords.longitude)},()=>status.textContent='定位失敗，請檢查權限',{enableHighAccuracy:true,timeout:12000}):null;demo.onclick=()=>{status.textContent='大埔示範位置';render(22.4502,114.1685)};render(22.4502,114.1685)</script></body></html>
