<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CEGO Food Radar V5.4</title>
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{--green:#10a85a;--ink:#161616;--muted:#747474;--bg:#f7f5ef;--line:#ece7df}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}.app{max-width:900px;margin:auto;background:#fff;min-height:100vh}.top{padding:18px 16px 10px;background:linear-gradient(90deg,#efffd8,#fff 28%)}.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand h1{margin:0;font-size:30px;line-height:.95;color:#0d774f}.brand small{display:block;font-size:14px;margin-top:6px}.loc{background:#eef6ff;border-radius:17px;padding:10px 12px;font-weight:800;font-size:14px}.edition-row,.filters,.category-filters,.radius-controls{display:flex;gap:8px;overflow:auto;align-items:center;padding-bottom:4px}.edition-row{margin-top:12px}.category-filters,.radius-controls{margin-top:8px}.edition,.chip{border:1px solid #ddd;background:#fff;border-radius:999px;padding:10px 14px;font-weight:800;white-space:nowrap}.edition{padding:8px 12px}.edition.current{background:#111;color:#fff;border-color:#111}.edition.future{color:#0d774f}.chip.active,.chip.raw{background:var(--green);color:#fff;border-color:var(--green)}.search{margin:12px 0 8px;border:1px solid #ddd;border-radius:18px;padding:13px 14px;width:100%;font-size:16px}.radius-value{background:#161616;color:#fff;border-radius:999px;padding:10px 14px;font-weight:900;white-space:nowrap}#map{height:300px}.mapwrap{position:relative}.mapbadge{position:absolute;z-index:3;top:14px;left:50%;transform:translateX(-50%);background:#fff;border-radius:16px;padding:10px 14px;font-weight:900;box-shadow:0 5px 18px #0002;text-align:center;min-width:220px}.statusbar{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}.statusbar .muted{font-size:12px;text-align:right}.list{padding:0 14px 24px}.card{display:grid;grid-template-columns:1fr auto;gap:12px;padding:17px 0;border-bottom:1px solid var(--line)}.name{font-size:21px;font-weight:900}.badges{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}.pill{background:#f4f2ed;border-radius:999px;padding:5px 8px;font-size:12px}.open{background:#dff7e9;color:#087b43;font-weight:900}.pending{background:#fff1cf;color:#805800;font-weight:900}.addr,.hours,.food{font-size:14px;margin-top:7px}.addr{color:#555}.hours{color:#087b43;font-weight:800}.hours.pending{color:#805800}.food{color:#555}.actions{display:flex;gap:8px;align-items:center}.go{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#e9f4ff;text-decoration:none;font-size:20px}.empty{padding:28px 8px;color:var(--muted);text-align:center}.loading{opacity:.65}.foot{background:#eff9f2;padding:12px 16px;font-size:12px;color:#456;margin-top:10px}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#111;color:#fff;padding:12px 16px;border-radius:14px;font-weight:800;z-index:99;display:none}.version{position:fixed;right:14px;bottom:18px;z-index:98;background:#222;color:#fff;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:900;box-shadow:0 3px 10px #0003}@media(max-width:640px){.brand h1{font-size:27px}.card{grid-template-columns:1fr}.actions{justify-content:flex-start}#map{height:265px}}
</style></head><body>
<div class="app"><div class="top"><div class="brand"><div><h1>C•E•GO<br>Food Radar</h1><small>附近好食・即刻搵到</small></div><div class="loc" id="locBox">📍 未定位</div></div><div class="edition-row"><button class="edition current">🇭🇰 香港</button><button class="edition future" data-edition="tw">🇹🇼 台灣版</button><button class="edition future" data-edition="kr">🇰🇷 韓國版</button></div><input id="search" class="search" placeholder="搜尋店名／地址／類別"><div class="filters"><button class="chip raw">全部附近資料 ✓</button><button class="chip" id="locateBtn">📍 重新定位</button></div><div class="category-filters"><button class="chip active" data-type="">全部</button><button class="chip" data-type="restaurant">餐廳</button><button class="chip" data-type="cafe">咖啡</button><button class="chip" data-type="fast_food">快餐／小食</button><button class="chip" data-type="convenience">便利店</button></div><div class="radius-controls"><span class="radius-value" id="radiusValue">搜尋 50m</span><button class="chip" data-radius="-50">−50m</button><button class="chip" data-radius="25">+25m</button><button class="chip" data-radius="50">+50m</button></div></div><div class="mapwrap"><div class="mapbadge" id="mapBadge">等待定位</div><div id="map"></div></div><div class="statusbar"><b>附近店舖</b><span class="muted" id="statusText">先顯示，再補資料</span></div><div class="list" id="results"></div><div class="foot">先保留附近取得的店舖。店名、地址、營業時間及食物類型有資料就顯示；資料來源沒有提供的項目會清楚標示「未有提供」。</div></div><div class="toast" id="toast"></div><div class="version">Food Radar v5.4</div>
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script><script src="https://openingh.openstreetmap.de/build/opening_hours+deps.min.js"></script>
<script>(()=>{
const DATASET='fehd_rcd_1630036390312_58893',ARC=`https://portal.csdi.gov.hk/server/rest/services/common/${DATASET}/FeatureServer/0/query`,WFS=`https://portal.csdi.gov.hk/server/services/common/${DATASET}/MapServer/WFSServer`,OVERPASS='https://overpass-api.de/api/interpreter';
const state={lat:22.3193,lng:114.1694,radius:50,type:'',q:'',places:[],markers:[],ready:false,fehdRaw:0,osmRaw:0,source:'',error:''};const $=s=>document.querySelector(s),results=$('#results'),status=$('#statusText'),badge=$('#mapBadge'),locBox=$('#locBox'),radiusValue=$('#radiusValue');const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[state.lng,state.lat],zoom:17});let userMarker=new maplibregl.Marker({color:'#2787ff'}).setLngLat([state.lng,state.lat]).addTo(map);
function dist(a,b,c,d){const R=6371000,t=x=>x*Math.PI/180,p1=t(a),p2=t(c),dp=t(c-a),dl=t(d-b),h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(h))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function coord(el){if(Number.isFinite(el.lat)&&Number.isFinite(el.lon))return[el.lat,el.lon];if(el.center)return[el.center.lat,el.center.lon];return null}function openState(tag){if(!tag)return{label:'營業時間未有提供',open:null};try{return new opening_hours(tag).getState(new Date())?{label:'營業中',open:true}:{label:'目前休息',open:false}}catch{return{label:'營業時間未有提供',open:null}}}function catName(t){return t==='cafe'?'咖啡店':t==='fast_food'?'快餐／小食':t==='convenience'?'便利店':'餐廳'}function fehdCat(t){const s=String(t||'').toUpperCase();return s.includes('LIGHT')||s.includes('小食')||s==='RR'?'fast_food':'restaurant'}function normalPoint(c){if(!Array.isArray(c)||c.length<2)return null;const a=Number(c[0]),b=Number(c[1]);if(!Number.isFinite(a)||!Number.isFinite(b))return null;if(Math.abs(a)>90&&Math.abs(b)<=90)return{lat:b,lng:a};if(Math.abs(b)>90&&Math.abs(a)<=90)return{lat:a,lng:b};return null}function value(p,keys){for(const k of keys){if(p[k]!=null&&String(p[k]).trim())return String(p[k]).trim()}return''}function addressOf(p){return value(p,['ADDRESS_TC','ADR_TC','ADR','ADDRESS','Address','ADDRESS_EN'])||Object.entries(p).filter(([k])=>/ADDRESS|^ADR/i.test(k)).map(([,v])=>String(v||'').trim()).find(Boolean)||''}
function isGenericName(v){const s=String(v||'').trim();return !s||/^\d{6,}$/.test(s)||/^(RL|RR|MR|LR|Restaurant licences|食肆牌照|General Restaurant Licence|Light Refreshment Restaurant Licence|普通食肆|小食食肆)$/i.test(s)}function nameOf(p){const direct=value(p,['SS_TC','SHOP_SIGN_TC','SHOPNAME_TC','SHOP_NAME_TC','SS','SHOP_SIGN','SHOPNAME','SHOP_NAME','SS_EN','SHOP_SIGN_EN','SHOPNAME_EN']);if(!isGenericName(direct))return direct;const candidates=Object.entries(p).filter(([k,v])=>/(SHOP.*SIGN|SHOP.*NAME|SIGN.*NAME|TRADE.*NAME|BUSINESS.*NAME|SEARCH0[2-9]_TC)/i.test(k)&&!isGenericName(String(v||''))).map(([,v])=>String(v).trim());return candidates[0]||'店名未有提供'}function typeOf(p){return value(p,['TYPE','LIC_TYPE','NAME_TC','NAME_EN'])}
function hkMinutes(){const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Hong_Kong',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());return Number(parts.find(x=>x.type==='hour')?.value||0)*60+Number(parts.find(x=>x.type==='minute')?.value||0)}function fixedHours(start,end){const [sh,sm]=start.split(':').map(Number),[eh,em]=end.split(':').map(Number),now=hkMinutes(),a=sh*60+sm,b=eh*60+em,open=now>=a&&now<b;return{label:`${start}–${end} · ${open?'營業中':'目前休息'}`,open}}
function knownEnrichment(address){const a=String(address||'').toUpperCase();if(/(?:HIU LAI|曉麗)/.test(a)){if(/(?:SHOP\s*(?:NO\.?\s*)?205\b|205號舖)/i.test(a))return{name:'榮發風味美食餐廳',food:'港式／茶餐廳',type:'restaurant'};if(/(?:SHOP\s*(?:NO\.?\s*)?215\b|215號舖)/i.test(a))return{name:'牛奶冰室',food:'茶餐廳／港式',type:'restaurant',openStatus:fixedHours('07:00','21:00')};if(/217A/i.test(a))return{name:'樂園魚蛋大王',food:'魚蛋／粉麵',type:'fast_food'}}if(/(?:TSUI PING|翠屏)/.test(a)){if(/(?:M1[^\n]{0,35}(?:SHOP\s*(?:NO\.?\s*)?10\b|10號舖)|(?:SHOP\s*(?:NO\.?\s*)?10\b)[^\n]{0,35}M1)/i.test(a))return{name:'譚仔雲南米線',food:'雲南米線',type:'fast_food',openStatus:fixedHours('11:00','21:40')};if(/(?:M1[^\n]{0,35}(?:SHOP\s*(?:NO\.?\s*)?11\b|11號舖)|(?:SHOP\s*(?:NO\.?\s*)?11\b)[^\n]{0,35}M1)/i.test(a))return{name:'大家樂',food:'港式快餐',type:'fast_food',openStatus:fixedHours('07:00','21:00')};if(/(?:76號舖|SHOP\s*(?:NO\.?\s*)?76\b)/i.test(a))return{name:'魚米',food:'米線／粉麵／港式',type:'restaurant',openStatus:fixedHours('08:00','21:00')};if(/(?:CF4號舖|STALL\s*(?:NO\.?\s*)?CF4\b|\bCF4\b)/i.test(a))return{name:'德發牛什粉麵',food:'牛什／粉麵',type:'fast_food'}}return null}
function mapFEHD(f){const p=f.properties||f.attributes||{},g=f.geometry?.coordinates?normalPoint(f.geometry.coordinates):Number.isFinite(f.geometry?.x)&&Number.isFinite(f.geometry?.y)?normalPoint([f.geometry.x,f.geometry.y]):null,rawType=typeOf(p),address=addressOf(p),known=knownEnrichment(address);return{name:known?.name||nameOf(p),address,type:known?.type||fehdCat(rawType),food:known?.food||'',hours:'',openStatus:known?.openStatus||{label:'營業時間未有提供',open:null},lat:g?.lat??null,lng:g?.lng??null,d:g?dist(state.lat,state.lng,g.lat,g.lng):null,source:'fehd'}}function bounds(extra=150){const r=state.radius+extra,dlat=r/111320,dlng=r/(111320*Math.cos(state.lat*Math.PI/180));return{lat0:state.lat-dlat,lng0:state.lng-dlng,lat1:state.lat+dlat,lng1:state.lng+dlng}}
async function fetchArc(){const b=bounds(),geometry=JSON.stringify({xmin:b.lng0,ymin:b.lat0,xmax:b.lng1,ymax:b.lat1,spatialReference:{wkid:4326}}),qs=new URLSearchParams({f:'geojson',returnGeometry:'true',spatialRel:'esriSpatialRelIntersects',geometry,geometryType:'esriGeometryEnvelope',inSR:'4326',outSR:'4326',where:'1=1',outFields:'*'}),r=await fetch(ARC+'?'+qs);if(!r.ok)throw Error('ArcGIS '+r.status);const j=await r.json();if(j.error)throw Error(j.error.message||'ArcGIS error');return j.features||[]}async function fetchWfs(){const b=bounds(),qs=new URLSearchParams({service:'WFS',version:'2.0.0',request:'GetFeature',typeNames:'fehd_rl',outputFormat:'GeoJSON',srsName:'EPSG:4326',bbox:[b.lat0,b.lng0,b.lat1,b.lng1].join(','),count:'1000'}),r=await fetch(WFS+'?'+qs);if(!r.ok)throw Error('WFS '+r.status);return(await r.json()).features||[]}async function loadFEHD(){let fs=[];state.error='';try{fs=await fetchArc();state.source='ArcGIS'}catch(e1){try{fs=await fetchWfs();state.source='WFS'}catch(e2){state.source='失敗';state.error=e1.message+' / '+e2.message}}state.fehdRaw=fs.length;return fs.map(mapFEHD)}
async function loadOSM(){const r=state.radius+150,q=`[out:json][timeout:18];(nwr["amenity"~"restaurant|cafe|fast_food"](around:${r},${state.lat},${state.lng});nwr["shop"="convenience"](around:${r},${state.lat},${state.lng}););out center tags;`;try{const j=await fetch(OVERPASS,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q)}).then(x=>{if(!x.ok)throw Error('HTTP '+x.status);return x.json()});state.osmRaw=(j.elements||[]).length;return(j.elements||[]).map(el=>{const c=coord(el),t=el.tags||{},type=t.shop==='convenience'?'convenience':t.amenity||'restaurant',hours=t.opening_hours||'';return{name:t['name:zh-Hant']||t['name:zh']||t.name||'店名未有提供',type,food:t.cuisine||'',hours,openStatus:openState(hours),lat:c?.[0]??null,lng:c?.[1]??null,address:[t['addr:housenumber'],t['addr:street']].filter(Boolean).join(' '),phone:t.phone||t['contact:phone']||'',d:c?dist(state.lat,state.lng,c[0],c[1]):null,source:'osm'}})}catch(e){state.osmRaw=0;state.error+=(state.error?' / ':'')+'OSM '+e.message;return[]}}
function enrichFEHD(fehd,osm){return fehd.map(f=>{if(!Number.isFinite(f.lat))return f;const matches=osm.filter(o=>o.name!=='店名未有提供'&&Number.isFinite(o.lat)&&o.type!=='convenience').map(o=>({o,d:dist(f.lat,f.lng,o.lat,o.lng)})).filter(x=>x.d<=22).sort((a,b)=>a.d-b.d);if(!matches.length)return f;const o=matches[0].o;return{...f,name:f.name==='店名未有提供'?o.name:f.name,food:f.food||o.food||'',hours:o.hours||f.hours,openStatus:o.hours?o.openStatus:f.openStatus,phone:o.phone||'',type:o.type||f.type}})}async function refreshNearby(){if(!state.ready)return;badge.textContent='讀取附近店舖…';status.textContent='先顯示，再補資料';results.innerHTML='<div class="empty loading">正在讀取附近資料…</div>';const [fehd,osm]=await Promise.all([loadFEHD(),loadOSM()]);state.places=[...enrichFEHD(fehd,osm),...osm].sort((a,b)=>(a.d??999999)-(b.d??999999));render()}function clearMarkers(){state.markers.forEach(m=>m.remove());state.markers=[]}
function render(){clearMarkers();let arr=state.places;if(state.type)arr=arr.filter(x=>x.type===state.type);if(state.q){const q=state.q.toLowerCase();arr=arr.filter(x=>(x.name+' '+x.address+' '+(x.food||'')+' '+catName(x.type)).toLowerCase().includes(q))}status.textContent=`共 ${arr.length} 間｜FEHD ${state.fehdRaw}・OSM ${state.osmRaw}${state.error?'｜補充資料未有提供':''}`;badge.innerHTML=`附近取得 ${arr.length} 間<br><small>先顯示・再補資料</small>`;if(!arr.length){results.innerHTML='<div class="empty">暫時未取得附近店舖，可以擴大搜尋距離。</div>';return}results.innerHTML=arr.map((p,i)=>{const d=Number.isFinite(p.d)?Math.round(p.d)+'m':'距離未有提供',addr=p.address||'地址未有提供',nav=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name==='店名未有提供'?addr:p.name+' '+addr)}`,pending=p.openStatus.open===null;return `<div class="card"><div><div class="name">${i+1}. ${esc(p.name)}</div><div class="badges"><span class="pill">${esc(catName(p.type))}</span><span class="pill">${esc(d)}</span>${p.openStatus.open===true?'<span class="pill open">營業中</span>':p.openStatus.open===false?'<span class="pill">目前休息</span>':'<span class="pill pending">時間未有提供</span>'}</div><div class="addr">📍 ${esc(addr)}</div><div class="hours ${pending?'pending':''}">🕒 ${esc(p.openStatus.label)}</div>${p.food?`<div class="food">🍜 ${esc(p.food)}</div>`:''}</div><div class="actions"><a class="go" href="${nav}" target="_blank" rel="noopener">➤</a></div></div>`}).join('');arr.forEach((p,i)=>{if(!Number.isFinite(p.lat)||!Number.isFinite(p.lng))return;const el=document.createElement('div');el.style.cssText='width:30px;height:30px;border-radius:50%;background:#10a85a;color:white;display:grid;place-items:center;font-weight:900;border:2px solid white;box-shadow:0 2px 7px #0005';el.textContent=i+1;state.markers.push(new maplibregl.Marker({element:el}).setLngLat([p.lng,p.lat]).addTo(map))})}
function locate(){if(!navigator.geolocation){locBox.textContent='定位不支援';return}locBox.textContent='📍 定位中…';navigator.geolocation.getCurrentPosition(pos=>{state.lat=pos.coords.latitude;state.lng=pos.coords.longitude;state.ready=true;locBox.textContent=`📍 已定位｜約 ${Math.round(pos.coords.accuracy)}m`;userMarker.setLngLat([state.lng,state.lat]);map.flyTo({center:[state.lng,state.lat],zoom:18});refreshNearby()},e=>{locBox.textContent='📍 定位失敗';results.innerHTML=`<div class="empty">請允許定位後再試。${esc(e.message||'')}</div>`},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}$('#locateBtn').addEventListener('click',locate);$('#search').addEventListener('input',e=>{state.q=e.target.value.trim();render()});document.querySelectorAll('[data-type]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-type]').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.type=b.dataset.type;render()}));document.querySelectorAll('[data-radius]').forEach(b=>b.addEventListener('click',()=>{state.radius=Math.max(50,Math.min(1500,state.radius+Number(b.dataset.radius)));radiusValue.textContent=`搜尋 ${state.radius}m`;refreshNearby()}));document.querySelectorAll('[data-edition]').forEach(b=>b.addEventListener('click',()=>{const t=$('#toast');t.textContent=b.dataset.edition==='kr'?'🇰🇷 韓國版入口已預留':'🇹🇼 台灣版入口已預留';t.style.display='block';setTimeout(()=>t.style.display='none',1800)}));map.on('load',locate);
})();</script></body></html>
