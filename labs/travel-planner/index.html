<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CEGO Travel Planner Test</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f7f4ee;color:#171717}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e7e1d8;border-radius:20px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}select,button{width:100%;padding:12px;border-radius:12px;border:1px solid #ddd;font-size:16px}button{background:#e65a2f;color:#fff;border:0;font-weight:800}.day{margin-top:12px;border:1px solid #eee;border-radius:16px;padding:12px}.stop{padding:10px 0;border-top:1px dashed #ddd}.stop:first-child{border-top:0}.muted{color:#777;font-size:13px}a{color:#e65a2f;font-weight:700;text-decoration:none}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>C•E•GO Travel Planner</h1><div class="muted">V3.0 Staging｜先檢查旅客證件及入境準備，再排行程</div><div class="card"><h2>🛂 出發前準備</h2><div class="grid"><select id=passport><option value=HK>🇭🇰 香港特區護照</option><option value=TW>🇹🇼 台灣護照</option><option value=CN>🇨🇳 中國護照</option><option value=MY>🇲🇾 馬來西亞護照</option><option value=SG>🇸🇬 新加坡護照</option></select><label>護照到期日<input id=expiry type=date style="width:100%;padding:11px;border:1px solid #ddd;border-radius:12px;box-sizing:border-box;margin-top:5px"></label><label>出發日期<input id=depart type=date style="width:100%;padding:11px;border:1px solid #ddd;border-radius:12px;box-sizing:border-box;margin-top:5px"></label><label>回程日期<input id=returnDate type=date style="width:100%;padding:11px;border:1px solid #ddd;border-radius:12px;box-sizing:border-box;margin-top:5px"></label></div><div id=entryCheck class=muted style="margin-top:10px">選擇證件及旅行日期後，會按「旅行證件 × 目的地 × 日期」核對簽證、電子旅行許可、Arrival Card、護照有效期及其他官方入境要求。規則不會寫死，正式版會以官方來源更新。</div></div><div class="card"><h2>🧳 行程設定</h2><div class="grid"><select id=city><option>釜山</option><option>首爾</option><option>曼谷</option><option>東京</option><option>台北</option><option>胡志明市</option></select><select id=days><option>1</option><option selected>2</option><option>3</option></select><select id=interest><option>混合</option><option>美食</option><option>咖啡</option><option>打卡</option><option>購物</option><option>K-pop</option></select><select id=pace><option>輕鬆</option><option selected>正常</option><option>密集</option></select></div><p><button id=go>幫我排行程</button></p></div><div class=card><h2>建議行程</h2><div id=result class=muted>按上面開始。</div></div></div><script>const db={釜山:[['南浦洞','南浦',['美食','購物'],'上午'],['松島海上纜車','松島',['打卡'],'上午'],['甘川文化村','甘川',['打卡'],'下午'],['海里海鮮午餐','影島',['美食'],'下午'],['Momo Coffee Factory','影島',['咖啡','購物'],'下午'],['富平罐頭市場','南浦',['美食','購物'],'晚上'],['海雲台','海雲台',['打卡'],'下午'],['Skyline Luge','機張',['打卡'],'上午']],首爾:[['明洞','明洞',['美食','購物'],'上午'],['聖水洞','聖水',['咖啡','打卡','購物'],'下午'],['東大門','東大門',['美食','購物'],'晚上'],['HYBE 周邊','龍山',['K-pop','打卡'],'下午'],['YG 周邊','麻浦',['K-pop','打卡'],'下午']],曼谷:[['Terminal 21','Asok',['美食','購物'],'上午'],['Maliwan Thai Dessert Shop','Ari',['美食'],'下午'],['舊城小食區','Old Town',['美食','打卡'],'下午'],['Hidden Bar 周邊','Old Town',['咖啡','美食'],'晚上'],['Big C','Ratchadamri',['購物'],'晚上'],['Save One Go Market','Bangkok',['美食','購物'],'晚上']]};function score(x,i){return i==='混合'?5:(x[2].includes(i)?30:0)}function run(){const c=city.value,n=+days.value,i=interest.value,p=pace.value,per=p==='輕鬆'?2:p==='密集'?4:3;let all=[...db[c]].sort((a,b)=>score(b,i)-score(a,i)),used=new Set(),out=[];for(let d=0;d<n;d++){let picks=[];for(const x of all){if(!used.has(x[0])&&picks.length<per){picks.push(x);used.add(x[0])}}if(picks.length)out.push(picks)}result.className='';result.innerHTML=out.map((arr,d)=>`<div class=day><b>Day ${d+1}</b>${arr.map(x=>`<div class=stop><b>${x[3]}｜${x[0]}</b><div class=muted>${x[1]} · ${x[2].join(' · ')}</div><a target=_blank href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x[0]+' '+c)}">Google Maps ↗</a></div>`).join('')}</div>`).join('')}go.onclick=run;run()function checkEntry(){const p=passport.value,e=expiry.value,d=depart.value,r=returnDate.value,c=city.value;let msg='🛂 '+passport.options[passport.selectedIndex].text+' → '+c+'：';if(!d){entryCheck.textContent=msg+'請先輸入出發日期。';return}if(e){const end=new Date(r||d),ex=new Date(e),days=Math.floor((ex-end)/86400000);msg+=days<0?' 🔴 護照會在旅程完結前到期。':days<180?' 🟠 護照距旅程完結少於 6 個月；實際是否符合會按目的地官方規定判斷。':' 🟢 護照距旅程完結超過 6 個月。'}else msg+=' 請輸入護照到期日。';msg+='｜簽證／電子許可／入境卡：待接官方規則 Provider。';entryCheck.textContent=msg}passport.onchange=checkEntry;expiry.onchange=checkEntry;depart.onchange=checkEntry;returnDate.onchange=checkEntry;city.addEventListener('change',checkEntry);</script></body></html>
