<!doctype html><html lang="zh-HK"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>到站修復</title><style>body{margin:0;background:#101114;color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.box{max-width:420px;margin:18vh auto;padding:28px}h1{font-size:30px}.note{color:#b7bac3;line-height:1.6}.ok{color:#70d39b;font-weight:700}.btn{display:block;margin-top:25px;background:#f7f7f8;color:#101114;padding:16px;border-radius:14px;text-align:center;text-decoration:none;font-size:18px;font-weight:800}</style><main class="box"><h1>正在修復「到站」</h1><p id="status" class="note">正在移除舊版背景程式…</p><a id="open" class="btn" href="./">返回到站</a></main><script>(async()=>{const s=document.querySelector("#status");try{if("serviceWorker"in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()));}if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}s.textContent="修復完成。你的常用路線資料仍會保留；請按下面按鈕返回到站。";s.className="note ok";}catch(e){s.textContent="已完成基本修復；請按下面按鈕返回到站。";s.className="note ok";}})();</script></html>
