name: Verify nearby MTR catalog
on:
  pull_request:
    paths:
      - 'scripts/build-mtr-stations.mjs'
      - 'nearby.js'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-mtr-stations.mjs
      - run: node --check nearby.js
      - run: node --check mtr-bus.js
      - run: node tests/nearby.cjs
      - run: node tests/nearby-mtr.cjs
