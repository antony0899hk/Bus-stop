name: Refresh traffic news

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traffic-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Transport Department feed
        run: python scripts/update_traffic.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- traffic.json; then
            echo 'No traffic change'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add traffic.json
          git commit -m 'chore: refresh traffic news'
          git push
